# --- build proof: rbuild's exact non-GL target line (GLES2 configure,
# --- --target test_packet, ctest -R TestPacket), timed, on each VM.
.b1194_proof:
  extends: [.goldfarm, .b1194_rules]
  stage: build
  allow_failure: true
  timeout: 2h

b1194-proof-r1:
  extends: .b1194_proof
  script:
    - |
      if [ "$(hostname)" = "gitlab-runner-1" ]; then bash refactor/B1194/scripts/build_proof.sh
      else echo "b1194-proof: landed on $(hostname), not gitlab-runner-1; no-op"; fi
