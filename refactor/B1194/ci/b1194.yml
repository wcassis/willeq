# --- hygiene proof: rbuild's exact hygiene line (EQT_GRAPHICS=OFF + ctest -L
# --- hygiene), timed, on each VM. Two copies per host.
.b1194_hyg:
  extends: [.goldfarm, .b1194_rules]
  stage: hygiene
  needs: []
  allow_failure: true
  timeout: 30m

b1194-hyg-r1-a:
  extends: .b1194_hyg
  script:
    - |
      if [ "$(hostname)" = "gitlab-runner-1" ]; then bash refactor/B1194/scripts/hygiene_proof.sh
      else echo "b1194-hyg: landed on $(hostname), not gitlab-runner-1; no-op"; fi
b1194-hyg-r1-b:
  extends: .b1194_hyg
  script:
    - |
