# T502 -- WillEQ CI on the project's own GitLab runner.
#
# WHY: builds and the ~4,900-case ctest suite were being run inside hermes
# kanban workers, which are capped at 4 GiB and were OOM-killed while linking.
# This moves both onto the shell runner (GitLab runner id 1, registered
# 2026-09-12), which executes on hermes-ext (172.16.200.100: 16 cores, 31 GB).
# The runner's GitLab-side description still reads "inspur-shell" -- that label
# is stale. hermes-ext ALSO hosts the hermes gateway and its kanban workers, so
# every heavy command here is bounded to JOBS (8 of 16 cores) and `nice -n 10`
# so a pipeline cannot starve a live worker.
#
# HARD GUARD: Will's ruling (2026-09-17) is that the Inspur inference box must
# never build (CPU contention with the GPUs). Every job therefore refuses to run
# on any host but hermes-ext, so a future runner reassignment fails loudly
# instead of quietly moving builds onto the Inspur.
#
# See docs/ci.md for how to read a pipeline, the warm-tree trade-off and how to
# retry the gate.

stages:
  - hygiene
  - build
  - test
  - gate
  # T503: last, and build-arm has `needs: []`, so it starts at once and NOTHING waits on it.
  - arm

variables:
  CMAKE_BUILD_TYPE: Release
  # 8 of hermes-ext's 16 cores; the rest stay for the gateway + kanban workers.
  JOBS: "8"
  CTEST_JOBS: "6"
  # Keep a warm tree per project on the runner: clean everything EXCEPT the two
  # build trees and the locally built Irrlicht, so a pipeline is incremental.
  # `git clean -ffdx -e <pattern>` keeps the excluded paths (GitLab passes these
  # flags straight to `git clean`); GitLab's own default is a bare `-ffdx`.
  # TRADE-OFF: a stale object file or a stale CMake cache can survive into the
  # next pipeline. A from-scratch pipeline is a manual
  # `rm -rf build build-gles2 third_party/irrlicht-gles2-x86` on the runner, or
  # run the pipeline with GIT_CLEAN_FLAGS=-ffdx (see docs/ci.md).
  GIT_CLEAN_FLAGS: -ffdx -e build -e build-gles2 -e third_party/irrlicht-gles2-x86

# Branch/MR scope, pipeline-wide: task/* and plans/* branches, merge requests,
# and fable. Never on tags. The CI_OPEN_MERGE_REQUESTS rule suppresses the
# duplicate branch pipeline once a branch has an open MR.
workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == "fable"
    - if: $CI_COMMIT_BRANCH =~ /^task\//
    - if: $CI_COMMIT_BRANCH =~ /^plans\//

.goldfarm:
  timeout: 3h
  interruptible: true
  # Nothing is passed between stages as artifacts -- the jobs share one warm
  # working tree on a concurrent=1 runner. Never download upstream artifacts.
  # B1008 (2026-10-08): the x86 jobs run on the dedicated runner VMs
  # (gitlab-runner-1/2, 10.0.30.81/82: 16 cores, 15 GB, local copies of the
  # two client trees at the same paths), tag `x86-build`, so hermes-ext's
  # untagged runner no longer builds (Will 2026-10-06: keep hermes-ext for the
  # board). ONE runner carries the tag today: the stages share a warm tree and
  # pass no artifacts, so a second tagged runner would split a pipeline across
  # two trees. gitlab-runner-2 is registered as `x86-build-2` and idles until
  # build+test+gate are folded into one job (docs/ci.md).
  dependencies: []
  tags: [x86-build]
  before_script:
    - set -o pipefail
    - 'case "$(hostname)" in hermes-ext|gitlab-runner-1|gitlab-runner-2) ;; *) echo "refusing to build on $(hostname)"; exit 1 ;; esac'
    - hostname; nproc; free -g | head -2
    # The client asset symlinks are gitignored (tests/test_data_paths.cpp), so
    # `git clean -ffdx` removes them before every job and they must be re-made
    # here. They are NOT only the gate's business: without them the asset
    # suites lose their real input, and the `test` job (which exports
    # WILLEQ_REQUIRE_ASSETS=1, B815) turns that absence into a hard FAIL
    # instead of a silent SKIP.
    - ln -sfn /mnt/projects/EverQuestP1999 data/eq_client
    - ln -sfn /mnt/projects/EverQuest_ETC1 data/eqe1_client

# Stage 1: pure source/doc scans (ctest label `hygiene`). No C++ compile, so it
# fails a bad doc/file-size/citation change in ~a minute instead of after a
# 30-minute build. Configured with EQT_GRAPHICS=OFF into build/hygiene -- a
# subdirectory of the preserved `build` tree, so its CMake cache (and the
# googletest FetchContent clone) also survives between pipelines.
hygiene:
  extends: .goldfarm
  stage: hygiene
  script:
    - nice -n 10 cmake -S . -B build/hygiene -DCMAKE_BUILD_TYPE=$CMAKE_BUILD_TYPE -DEQT_GRAPHICS=OFF -DEQT_BUILD_TESTS=ON
    - nice -n 10 ctest --test-dir build/hygiene -L hygiene -j $CTEST_JOBS --output-on-failure 2>&1 | tee hygiene-ctest.log
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - hygiene-ctest.log
      - build/hygiene/Testing/Temporary/LastTest.log

# Stage 2: the Release build (the recipe from CLAUDE.md). The patched x86 GLES2
# Irrlicht is BUILT, not committed; bootstrap it when it is missing OR STALE
# (B654, issue #56): the input stamp (scripts/ci/irrlicht_input_stamp.sh)
# hashes the committed device-source inputs this lib encodes, so a merge that
# changes docker/irrlicht-drm[-x86]/ or the build script forces a rebuild
# instead of every later pipeline silently testing against the old lib.
# (docs/ci.md, "Device-source changes are caught by the input stamp".)
build:
  extends: .goldfarm
  stage: build
  script:
    - |
      if [ ! -f third_party/irrlicht-gles2-x86/lib/libIrrlicht.a ] || ! bash scripts/ci/irrlicht_input_stamp.sh verify third_party/irrlicht-gles2-x86/irrlicht_input_stamp.txt; then
        JOBS=$JOBS nice -n 10 bash scripts/build-gles2-x86.sh --irrlicht-only
      fi
    - nice -n 10 cmake -S . -B build -DCMAKE_BUILD_TYPE=$CMAKE_BUILD_TYPE -DEQT_BUILD_TESTS=ON -DEQT_GRAPHICS=ON -DEQT_GLES2=ON -DEQT_GLES2_IRRLICHT_DIR=$PWD/third_party/irrlicht-gles2-x86
    # B907 (issue #227): this is a WARM tree shared with every other branch's
    # pipeline (GIT_CLEAN_FLAGS keeps build/ across runs). A binary another
    # branch's pipeline built into build/bin/ has no target in THIS branch's
    # just-regenerated CMake graph, and cmake never prunes bin/ on its own --
    # so it survives into this build and fails the `test` stage's
    # check_build_tree_orphans a moment later. Prune right after the
    # reconfigure above (so the graph is current) and before the build, using
    # the exact discovery check_build_tree_orphans uses read-only.
    - nice -n 10 python3 scripts/ci/check_build_tree_orphans.py --prune build
    - nice -n 10 cmake --build build -j $JOBS 2>&1 | tail -n 200

# Stage 3: the full suite, minus the two documented special cases:
#   - visual_gate      -- runs in the `gate` stage (it needs build-gles2/).
#   - RDPServerFrameTest.UpdateFrameMultipleTimes -- documented intermittent
#     race; re-run on its own with --repeat until-pass:3.
# T503 -- ARM cross-build for the Orange Pi, on the SECOND runner
# (dev-u24-arm-nfs: user-mode shell runner on the dev host, tag arm-nfs; it has
# docker, the willeq-arm-noble image and the NFS share the Pi also mounts).
# hermes-ext workers cannot see NFS but can ssh to the Pi, so the job publishes
# to /mnt/projects/fable/ci-arm/<sha>/ and a worker runs it there over ssh.
# Automatic on fable; on any other ref it is a MANUAL job that never blocks the
# pipeline (`glab ci trigger build-arm`). Own final stage + `needs: []`: it starts
# immediately and the x86 gate never waits for an ARM build.
build-arm:
  stage: arm
  tags: [arm-nfs]
  needs: []
  dependencies: []
  timeout: 2h
  interruptible: true
  variables:
    GIT_CLEAN_FLAGS: -ffdx -e build-arm-noble
  rules:
    - if: $CI_COMMIT_BRANCH == "fable"
    - when: manual
      allow_failure: true
  script:
    - set -o pipefail
    - '[ "$(hostname)" = "dev-u24" ] || { echo "refusing to build on $(hostname)"; exit 1; }'
    # B970: verify/fill the vendored Irrlicht+libpng store first; fails naming the pin.
    - scripts/ci/vendor_fetch.sh --ensure
    - nice -n 10 scripts/build-arm-noble.sh 2>&1 | tail -n 40
    - scripts/pi/publish_arm_build.sh "$CI_COMMIT_SHA" "${CI_COMMIT_BRANCH:-$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}"

test:
  extends: .goldfarm
  stage: test
  variables:
    # B815: an absent asset root is a SKIP in a local run, but CI has the
    # assets (before_script re-makes the gitignored symlinks) and must never
    # skip them silently -- under this value the same condition is a hard
    # FAIL. tests/asset_requirement.h implements the check;
    # test_asset_requirement pins both outcomes.
    WILLEQ_REQUIRE_ASSETS: "1"
  script:
    - nice -n 10 ctest --test-dir build -j $CTEST_JOBS --output-on-failure -E '(^visual_gate$|^RDPServerFrameTest\.UpdateFrameMultipleTimes$)' 2>&1 | tee ctest.log
    - nice -n 10 ctest --test-dir build -R '^RDPServerFrameTest\.UpdateFrameMultipleTimes$' --repeat until-pass:3 --output-on-failure 2>&1 | tee -a ctest.log
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - ctest.log
      - build/Testing/Temporary/LastTest.log

# Stage 4: the visual gate (T80/T291) -- golden frames + CPU-p95 + memory ledger
# over build-gles2/bin/gles2_zone_benchmark against real client assets.
# allow_failure is FALSE: hermes-ext has both asset trees and the pristine
# Irrlicht source, so nothing here is legitimately skippable. The CPU-p95
# assertion is load-sensitive (see tests/cmake/eqe1.cmake), so the retry is
# inside the script: up to 3 attempts, and the gate must pass one of them.
#
# B813 revert (Will, 2026-09-28; docs/decisions.md): budgets ratchet down
# only. iceclad and timorous ran in a separate allow_failure job while they
# overran two ledger budgets; B903/B904 (2026-09-29) fixed both in code, so the
# ONE blocking job runs all five manifest zones again. --zones stays explicit:
# the list must equal the manifest's zones exactly (checked by the hygiene test
# VisualGateLedgerAssertions, scripts/ci/test_visual_gate_ledger.py). No waiver
# list, no per-zone budget.
.visual_gate_prepare:
  script:
    # visual_gate.py needs PIL; hermes-ext's python3.12 has no Pillow and no
    # ensurepip, so install it once into a cache dir with the pip from the
    # host's existing ~/.venvs/ci (python3.11) driving the 3.12 interpreter.
    - PYLIBS=$HOME/.cache/willeq-ci/pylibs
    - python3 -c "import PIL" 2>/dev/null || $HOME/.venvs/ci/bin/pip --python /usr/bin/python3 install -q --target "$PYLIBS" Pillow
    - export PYTHONPATH="$PYLIBS${PYTHONPATH:+:$PYTHONPATH}"
    - python3 -c "import PIL; print('PIL', PIL.__version__)"
    # build-gles2/ is preserved between pipelines. The bootstrap script always
    # wipes and rebuilds Irrlicht, so only call it when there is no benchmark
    # binary yet; otherwise build the two targets incrementally (cmake re-runs
    # its own configure if CMakeLists.txt changed).
    # B959: the gate's incremental path never looked at libIrrlicht, so a
    # driver-source change (a new eqt* symbol) linked against the OLD warm lib
    # whenever this job ran on a runner where the build job's rebuild was not
    # the one that landed. Same stamp check as the build job; a mismatch
    # rebuilds the lib (and rewrites the stamp) before the incremental build,
    # whose willeq / gles2_zone_benchmark then relink against it.
    - |
      if [ ! -f third_party/irrlicht-gles2-x86/lib/libIrrlicht.a ] || ! bash scripts/ci/irrlicht_input_stamp.sh verify third_party/irrlicht-gles2-x86/irrlicht_input_stamp.txt; then
        JOBS=$JOBS nice -n 10 bash scripts/build-gles2-x86.sh --irrlicht-only
      fi
    - |
      if [ -x build-gles2/bin/gles2_zone_benchmark ]; then
        nice -n 10 cmake --build build-gles2 --target willeq gles2_zone_benchmark -j "$JOBS" 2>&1 | tail -n 60
      else
        JOBS=$JOBS nice -n 10 bash scripts/build-gles2-x86.sh 2>&1 | tail -n 100
      fi

# B923 / #242: the CLIENT's own memory ledger against its budgets, run on a
# schedule rather than by hand. The blocking `gate` job below measures
# gles2_zone_benchmark, which never builds the client's collision and occluder
# structures, so the client-only ledger owners (spatial's sp.* rows, and audio,
# B977/#295) are asserted HERE: the rendered client (orangepi preset,
# WILLEQ_BASELINE=1, the same invocation ClientLedgerLive ctest uses) zoned
# into iceclad past steady_60s, with --assert-budgets -- every budgeted
# memoryLedgerBudgets category at ready and steady_60s must be inside its
# budget or the job is red (client_ledger_table.py check's exit 1).
#
# MANUAL, allow_failure: it takes the eqemu lane lock (one snapshot, one
# restore with the world down, the lane's own discipline) and holds the lane
# ~20 minutes, so it never blocks the pipeline; the schedule and an operator
# both trigger it (issue #242 acceptance 2: "ClientLedgerLive on a schedule
# with the result recorded"). The evidence dir and the check's per-category
# lines are artifacts -- the recorded result. Needs the willeq binary from
# the `build` stage's tree (build/bin/willeq), not build-gles2/'s.
#
# Declared ABOVE `gate:` on purpose: test_visual_gate_ledger asserts the gate
# job's body (the text after "\ngate:") contains no "allow_failure: true", so
# this manual job must not sit in that slice. Same stage (gate), so the file
# order is cosmetic to the pipeline.
client-ledger-live:
  extends: .goldfarm
  stage: gate
  needs: [build]
  dependencies: [build]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH
      when: manual
      allow_failure: true
  script:
    - test -x build/bin/willeq || { echo "no build/bin/willeq -- the build stage did not land"; exit 1; }
    - |
      nice -n 10 bash scripts/client_ledger_capture.sh \
        --zones iceclad --modes spatial --assert-budgets \
        --owner ci-client-ledger \
        --out client-ledger-live/client-ledger-$(date -u +%Y%m%dT%H%M%SZ) 2>&1 | tee client-ledger-live/log.txt
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - client-ledger-live/

gate:
  extends: .goldfarm
  stage: gate
  allow_failure: false
  script:
    - !reference [.visual_gate_prepare, script]
    - |
      set +e
      for attempt in 1 2 3; do
        echo "=== visual_gate attempt $attempt/3 ==="
        nice -n 10 bash scripts/ci/visual_gate.sh --zones qeynos2,gfaydark,befallen,iceclad,timorous 2>&1 | tee -a gate.log
        rc=${PIPESTATUS[0]}
        [ "$rc" -eq 0 ] && break
        echo "attempt $attempt failed (rc=$rc)" | tee -a gate.log
      done
      exit "$rc"
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - gate.log
      - build-gles2/ci_artifacts/

