# T502 -- WillEQ CI on the project's own GitLab runner.
#
# WHY: builds and the ~4,900-case ctest suite were being run inside hermes
# kanban workers, which are capped at 4 GiB and were OOM-killed while linking.
# This moves both onto the shell runner (GitLab runner id 1, registered
# 2026-09-12), which executes on hermes-ext (172.16.200.100: 16 cores, 31 GB).
# The runner's GitLab-side description still reads "inspur-shell" -- that label
# is stale. hermes-ext ALSO hosts the hermes gateway and its kanban workers, so
# every heavy command here is bounded to JOBS (8 of 16 cores) and `nice -n 10`
# so a pipeline cannot starve a live worker.
#
# HARD GUARD: Will's ruling (2026-09-17) is that the Inspur inference box must
# never build (CPU contention with the GPUs). Every job therefore refuses to run
# on any host but hermes-ext, so a future runner reassignment fails loudly
# instead of quietly moving builds onto the Inspur.
#
# See docs/ci.md for how to read a pipeline, the warm-tree trade-off and how to
# retry the gate.

# B1194 (#513): inventory + rbuild-equivalent proof jobs for the idle x86 runner
# VMs (self-selecting, allow_failure, inert on every branch but the B1194 one).
include:
  - local: 'refactor/B1194/ci/b1194.yml'

stages:
  - hygiene
  # B1042 (#362): ONE job, `build-test`, builds and runs the suite; there is no
  # separate `test` stage any more (see the comment above `build-test`).
  - build
  - gate
  # T503: last, and build-arm has `needs: []`, so it starts at once and NOTHING waits on it.
  - arm

variables:
  CMAKE_BUILD_TYPE: Release
  # 8 of hermes-ext's 16 cores; the rest stay for the gateway + kanban workers.
  JOBS: "8"
  CTEST_JOBS: "6"
  # Keep a warm tree per project on the runner: clean everything EXCEPT the
  # build roots (build-headless since B1038) and the locally built Irrlicht, so
  # a pipeline is incremental.
  # `git clean -ffdx -e <pattern>` keeps the excluded paths (GitLab passes these
  # flags straight to `git clean`); GitLab's own default is a bare `-ffdx`.
  # TRADE-OFF: a stale object file or a stale CMake cache can survive into the
  # next pipeline OF THE SAME REF. A from-scratch pipeline is a manual
  # `rm -rf build build-gles2 third_party/irrlicht-gles2-x86` on the runner, or
  # run the pipeline with GIT_CLEAN_FLAGS=-ffdx (see docs/ci.md).
  # B1042 (#362): since ccache, a wiped tree is a cold CMAKE tree but NOT a
  # cold compile -- the object cache lives outside the checkout
  # (~gitlab-runner/.cache/ccache, 20G per runner, git clean never sees it).
  # A truly cold compile also needs CCACHE_DISABLE=1 (docs/ci.md, "ccache on
  # the x86 runners").
  # B1087 (#407): ONE runner (the ThinkPad) now runs the x86 AND the ARM jobs in
  # the same checkouts, and the ARM jobs' docker cross-build writes
  # build-arm*-noble/cache as ROOT, which a gitlab-runner `git clean` cannot
  # remove (MR !211 pipeline 1427: hygiene died in the clean). The x86 jobs
  # therefore keep the two ARM trees too, exactly as the ARM jobs always have.
  GIT_CLEAN_FLAGS: -ffdx -e build -e build-gles2 -e build-headless -e third_party/irrlicht-gles2-x86 -e build-arm-noble -e build-arm64-noble
  # B1012 (#333): ONE WARM TREE PER REF. Two branches' pipelines interleaving
  # on the concurrent=1 runner shared one build/ -- MR !119's `test` stage
  # (pipeline 697) ran over binaries MR !118's `build` stage (698) had just
  # written, and failed on tests that did not exist in its own source. Each
  # ref now configures into its own subtree, so a pipeline can only ever see
  # its own ref's leftovers (the within-ref warm speed is kept). The `build-test`
  # and `gate` jobs stamp the tree they use with .willeq_ref; the
  # `prune-build-trees` job (fable pipelines) deletes trees whose ref is gone
  # from the remote or untouched for 14 days -- the expiry the old shared
  # layout never had -- and prints the census. $CI_COMMIT_REF_SLUG is the
  # SOURCE branch for an MR pipeline too, so a branch's push pipeline and its
  # MR pipeline share one tree. build/hygiene stays shared: no binaries, a
  # cheap reconfigure, and the googletest FetchContent clone is worth keeping.
  BUILD_TREE: build/ref/$CI_COMMIT_REF_SLUG
  GLES2_TREE: build-gles2/ref/$CI_COMMIT_REF_SLUG
  # B1042 (#362): ccache on the x86 runners (gitlab-runner-1/2 have it; the
  # launcher is only passed when `command -v ccache` succeeds, .goldfarm).
  # Every ref configures into its own build/ref/<slug>, so the compile lines
  # carry different absolute paths per ref; CCACHE_BASEDIR rewrites paths under
  # the checkout to relative ones (the per-ref trees are all the same depth),
  # so a NEW branch hits the objects fable's tree already compiled.
  # CCACHE_NOHASHDIR keeps the cwd out of the hash should a -g build appear.
  CCACHE_BASEDIR: $CI_PROJECT_DIR
  CCACHE_NOHASHDIR: "1"

# Branch/MR scope, pipeline-wide: task/* and plans/* branches, merge requests,
# and fable. Never on tags. The CI_OPEN_MERGE_REQUESTS rule suppresses the
# duplicate branch pipeline once a branch has an open MR -- but only ONCE THE
# MR EXISTS: the first push of a new branch still runs a full branch pipeline
# that the MR pipeline then repeats. So push with `git push -o ci.skip -u
# gitlab task/...`, THEN open the MR (B1042, docs/ci.md "Push with -o ci.skip,
# then open the MR"). Docs-only diffs skip the C++ jobs: `.code_rules` below.
workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    # B1208 (#527): `rbuild --via ci` pushes a WIP commit titled "rbuild: ci build
    # <target>" with the push option ci.variable=RBUILD_TARGET=<t>. Its push
    # pipeline is created even when the branch has an open MR (this rule sits
    # above the CI_OPEN_MERGE_REQUESTS one) and carries ONLY the `rbuild` job
    # (`.not_rbuild` on every other job); the MR pipeline the same push would
    # trigger is suppressed by the title, so a worker build never runs the suite.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_COMMIT_TITLE =~ /^rbuild: ci build/'
      when: never
    - if: $RBUILD_TARGET && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "fable"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == "fable"
    - if: $CI_COMMIT_BRANCH =~ /^task\//
    - if: $CI_COMMIT_BRANCH =~ /^plans\//

.goldfarm:
  timeout: 3h
  interruptible: true
  # Nothing is passed between stages as artifacts -- each job uses the warm
  # working tree of the concurrent=1 runner it lands on (one build subtree per
  # ref, B1012). Never download upstream artifacts.
  # B1008 (2026-10-08): the x86 jobs run on the dedicated runner VMs
  # (gitlab-runner-1/2, 10.0.30.81/82: 16 cores, 15 GB, local copies of the
  # two client trees at the same paths), tag `x86-build`, so hermes-ext's
  # untagged runner no longer builds (Will 2026-10-06: keep hermes-ext for the
  # board). BOTH runners carry `x86-build` (runner-2 since 2026-10-11), so the
  # stages of one pipeline may land on DIFFERENT hosts, each with its own
  # warm tree. B1026 (#346) is what makes that safe: the build tree carries a
  # host+sha stamp written only after a successful build (`.build_tree`), and
  # every job that consumes the tree (`build-test` after its own build, B1042;
  # `client-ledger-live`) verifies it first and rebuilds in-job on a mismatch
  # (fable pipeline 809 tested runner-2's stale binary after runner-1 built
  # the new one; docs/ci.md, "Two x86 runners: the host+sha stamp").
  dependencies: []
  tags: [x86-build]
  before_script:
    - set -o pipefail
    - 'case "$(hostname)" in hermes-ext|gitlab-runner-1|gitlab-runner-2|thinkpad) ;; *) echo "refusing to build on $(hostname)"; exit 1 ;; esac'
    # B1087 (#407): the runner's own CI_JOBS (config.toml `environment`) wins
    # over this file's JOBS, so a host sizes its builds to what it shares: the
    # ThinkPad (primary runner, concurrent=3, beside the lane-5 oracle) sets 8.
    - 'if [ -n "${CI_JOBS:-}" ]; then export JOBS="$CI_JOBS"; fi; echo "JOBS=$JOBS (runner CI_JOBS=${CI_JOBS:-unset})"'
    - hostname; nproc; free -g | head -2
    # The client asset symlinks are gitignored (tests/test_data_paths.cpp), so
    # `git clean -ffdx` removes them before every job and they must be re-made
    # here. They are NOT only the gate's business: without them the asset
    # suites lose their real input, and the `build-test` job (which exports
    # WILLEQ_REQUIRE_ASSETS=1, B815) turns that absence into a hard FAIL
    # instead of a silent SKIP.
    - ln -sfn /mnt/projects/EverQuestP1999 data/eq_client
    - ln -sfn /mnt/projects/EverQuest_ETC1 data/eqe1_client
    - echo "build tree $BUILD_TREE / gate tree $GLES2_TREE (ref $CI_COMMIT_REF_NAME)"
    # B1042 (#362): the ccache launcher, only where ccache exists (hermes-ext
    # has none). CCACHE_CMAKE_ARGS goes on every x86 configure; the exported
    # CMAKE_*_COMPILER_LAUNCHER env vars cover scripts/build-gles2-x86.sh (its
    # configure and its Irrlicht `make`). CCACHE_STATSLOG is per job (inside the
    # checkout, so git clean resets it): `ccache --show-log-stats` is THIS job's
    # hit rate, `ccache -s` the host's running totals. ccache_report prints both
    # after every `cmake --build`. Without ccache the -U arguments drop a
    # launcher a warm tree may still carry.
    - |
      if command -v ccache >/dev/null 2>&1; then
        export CMAKE_C_COMPILER_LAUNCHER=ccache CMAKE_CXX_COMPILER_LAUNCHER=ccache CCACHE_STATSLOG="$CI_PROJECT_DIR/ccache-stats.log"
        CCACHE_CMAKE_ARGS="-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
        ccache_report() { echo "=== ccache after $1 on $(hostname): this job (stats log) ==="; ccache --show-log-stats || true; echo "=== ccache host totals ==="; ccache -s || true; }
      else
        CCACHE_CMAKE_ARGS="-UCMAKE_C_COMPILER_LAUNCHER -UCMAKE_CXX_COMPILER_LAUNCHER"
        ccache_report() { echo "=== ccache after $1: not installed on $(hostname), no launcher ==="; }
      fi
      echo "ccache: ${CCACHE_CMAKE_ARGS}"

# B1208 (#527): an `rbuild --via ci` pipeline ($RBUILD_TARGET set) runs the
# `rbuild` job and NOTHING else. Every other job's rules start with this
# reference (directly, or through `.code_rules`); pinned by CiQueueRules.
.not_rbuild:
  rules:
    - if: $RBUILD_TARGET
      when: never

# B1042 (#362): DOCS-ONLY DIFFS SKIP THE C++ JOBS. A job carrying these rules
# (build-test, gate, zone-budget-census, client-ledger-live) is added only when
# at least one
# changed path does NOT end in `.md`; `hygiene` has no code rule and always runs,
# so a docs-only pipeline is hygiene alone and still ends `success` (what the
# merge gate reads). "Docs-only" is deliberately just `*.md`, anywhere
# (review/ and refactor/ notes included): a change that also carries a .tsv,
# .png or script builds as before. What each pipeline compares against:
#   - MR pipeline: the MR's diff against its target branch (GitLab's rule);
#   - fable push: the pushed range (the merge's diff); a fable pipeline with no
#     push event (schedule, "Run pipeline") always runs everything;
#   - task/ plans/ push: compare_to fable, so a NEW branch's first push is
#     judged on its diff from fable (without compare_to GitLab treats a new
#     branch as "everything changed").
# WILLEQ_FULL_PIPELINE=1 ("Run pipeline" variable) forces the full set.
# The regexp form (GitLab >= 19.2; this instance is 19.3.1) is used because
# glob `changes:` can only say "any of these changed", never "a non-.md
# changed". Pinned by the hygiene test CiQueueRules.
.code_rules:
  rules:
    - !reference [.not_rbuild, rules]
    - if: $WILLEQ_FULL_PIPELINE == "1"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        regexp: &code_change_re '\A(?!.*\.md\z)'
    - if: $CI_COMMIT_BRANCH == "fable"
      changes:
        regexp: *code_change_re
    - if: $CI_COMMIT_BRANCH
      changes:
        regexp: *code_change_re
        compare_to: refs/heads/fable

# B1012 (#333): the expiry for the per-ref warm trees, and the census an
# operator reads to see what the runner holds. Automatic on fable pipelines
# (every merge runs one), MANUAL and non-blocking anywhere else. Deletes a
# tree whose stamped ref is no longer a remote branch, whose stamp is older
# than 14 days, or that carries no stamp at all (the pre-B1012 shared tree's
# leftovers at build/ and build-gles2/ root are swept by the same rule in
# the script's legacy step). Declared before `gate:` on purpose
# (test_visual_gate_ledger slices the file at "\ngate:").
prune-build-trees:
  extends: .goldfarm
  stage: hygiene
  needs: []
  rules:
    - !reference [.not_rbuild, rules]
    - if: $CI_COMMIT_BRANCH == "fable"
    - when: manual
      allow_failure: true
  script:
    - git ls-remote --heads origin | awk '{print $2}' | sed 's#^refs/heads/##' > live-refs.txt
    - wc -l live-refs.txt
    - nice -n 10 python3 scripts/ci/prune_ref_build_trees.py --root build/ref --root build-gles2/ref --root build-headless/ref --live-refs-file live-refs.txt --max-age-days 14 --legacy-root build --legacy-root build-gles2 2>&1 | tee prune.log
    # B1087 (#407): `du` exits 1 when a root is absent, and under pipefail that
    # failed the job on the ThinkPad, whose concurrent=3 gives each slot its own
    # checkout (builds/<runner>/0..2), so not every slot has every tree.
    - '{ du -sh build build-gles2 build-headless third_party/irrlicht-gles2-x86 2>/dev/null || true; } | tee -a prune.log; df -h . | tail -1 | tee -a prune.log'
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - prune.log

# Stage 1: pure source/doc scans (ctest label `hygiene`). No C++ compile, so it
# fails a bad doc/file-size/citation change in ~a minute instead of after a
# 30-minute build. no condition of its own (B1042; its one rule is B1208's
# `.not_rbuild`: an rbuild pipeline runs only `rbuild`): it runs on every pipeline,
# docs-only ones included -- for those it is the whole pipeline. Configured with EQT_GRAPHICS=OFF into build/hygiene -- a
# subdirectory of the preserved `build` tree, so its CMake cache (and the
# googletest FetchContent clone) also survives between pipelines.
hygiene:
  extends: .goldfarm
  stage: hygiene
  rules:
    - !reference [.not_rbuild, rules]
    - when: on_success
  script:
    - nice -n 10 cmake -S . -B build/hygiene -DCMAKE_BUILD_TYPE=$CMAKE_BUILD_TYPE -DEQT_GRAPHICS=OFF -DEQT_BUILD_TESTS=ON $CCACHE_CMAKE_ARGS
    - nice -n 10 ctest --test-dir build/hygiene -L hygiene -j $CTEST_JOBS --output-on-failure 2>&1 | tee hygiene-ctest.log
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - hygiene-ctest.log
      - build/hygiene/Testing/Temporary/LastTest.log

# Stage 2: the Release build (the recipe from CLAUDE.md). The patched x86 GLES2
# Irrlicht is BUILT, not committed; bootstrap it when it is missing OR STALE
# (B654, issue #56): the input stamp (scripts/ci/irrlicht_input_stamp.sh)
# hashes the committed device-source inputs this lib encodes, so a merge that
# changes docker/irrlicht-drm[-x86]/ or the build script forces a rebuild
# instead of every later pipeline silently testing against the old lib.
# (docs/ci.md, "Device-source changes are caught by the input stamp".)
#
# B1026 (#346): the build steps live in ONE place, the shell function
# willeq_build_tree defined by `.build_tree` below. The `build-test` job runs
# it; `client-ledger-live` defines it too and runs it only when the tree it
# landed on is not stamped by THIS host at THIS sha. Order inside it:
#   1. a ref-only stamp BEFORE the configure -- it wipes any earlier host/sha
#      claim, so a build that fails part-way leaves a tree no job trusts;
#   2. configure (with the B1042 ccache launcher when the host has ccache),
#      B907 orphan prune, `cmake --build`, the ccache report;
#   3. the host+sha claim, written only once `cmake --build` succeeded (errexit
#      + pipefail: a failed build never reaches this line).
.build_tree:
  script:
    - |
      willeq_build_tree() {
        set -eo pipefail
        echo "=== willeq_build_tree: $BUILD_TREE on $(hostname) at $CI_COMMIT_SHA ==="
        # B1038 (#358): WILLEQ_HEADLESS=1 (the build-headless job) configures
        # EQT_GRAPHICS=OFF and needs no Irrlicht; every other step is shared.
        if [ "${WILLEQ_HEADLESS:-0}" != 1 ]; then
          if [ ! -f third_party/irrlicht-gles2-x86/lib/libIrrlicht.a ] || ! bash scripts/ci/irrlicht_input_stamp.sh verify third_party/irrlicht-gles2-x86/irrlicht_input_stamp.txt; then
            JOBS=$JOBS nice -n 10 bash scripts/build-gles2-x86.sh --irrlicht-only
          fi
        fi
        python3 scripts/ci/prune_ref_build_trees.py --stamp "$BUILD_TREE" --ref "$CI_COMMIT_REF_NAME"
        if [ "${WILLEQ_HEADLESS:-0}" = 1 ]; then
          nice -n 10 cmake -S . -B "$BUILD_TREE" -DCMAKE_BUILD_TYPE=$CMAKE_BUILD_TYPE -DEQT_BUILD_TESTS=ON -DEQT_GRAPHICS=OFF $CCACHE_CMAKE_ARGS
        else
          nice -n 10 cmake -S . -B "$BUILD_TREE" -DCMAKE_BUILD_TYPE=$CMAKE_BUILD_TYPE -DEQT_BUILD_TESTS=ON -DEQT_GRAPHICS=ON -DEQT_GLES2=ON -DEQT_GLES2_IRRLICHT_DIR=$PWD/third_party/irrlicht-gles2-x86 $CCACHE_CMAKE_ARGS
        fi
        # B907 (issue #227): this is a WARM tree (GIT_CLEAN_FLAGS keeps build/
        # across runs; since B1012 it is this ref's own tree, so the orphan can
        # only be this ref's earlier commit's binary). A binary with no target in
        # the just-regenerated CMake graph survives in bin/ because cmake never
        # prunes bin/ on its own, and fails the suite's
        # check_build_tree_orphans a moment later. Prune right after the
        # reconfigure above (so the graph is current) and before the build, using
        # the exact discovery check_build_tree_orphans uses read-only.
        nice -n 10 python3 scripts/ci/check_build_tree_orphans.py --prune "$BUILD_TREE"
        # B1208 (#527): WILLEQ_BUILD_TARGETS (the `rbuild` job) builds named
        # targets only; `auto` derives them from $RBUILD_TEST through the
        # file-API codemodel (scripts/ci/rbuild_test_targets.py).
        if [ "${WILLEQ_BUILD_TARGETS:-}" = auto ]; then
          WILLEQ_BUILD_TARGETS=$(python3 scripts/ci/rbuild_test_targets.py --tree "$BUILD_TREE" --regex "$RBUILD_TEST")
        fi
        nice -n 10 cmake --build "$BUILD_TREE" -j $JOBS ${WILLEQ_BUILD_TARGETS:+--target $WILLEQ_BUILD_TARGETS} 2>&1 | tail -n 200
        ccache_report "$BUILD_TREE"
        # A partial (--target) build leaves only the ref-only stamp: it never
        # claims the tree for this host+sha (B1026's verify then rebuilds).
        if [ -z "${WILLEQ_BUILD_TARGETS:-}" ]; then python3 scripts/ci/prune_ref_build_trees.py --stamp "$BUILD_TREE" --ref "$CI_COMMIT_REF_NAME" --host "$(hostname)" --sha "$CI_COMMIT_SHA"; fi
      }

# B1026: verify the tree this job landed on; on a mismatch say so loudly,
# rebuild it here with the build job's own steps, and verify again (must pass).
.verify_build_tree:
  script:
    - !reference [.build_tree, script]
    - |
      if python3 scripts/ci/prune_ref_build_trees.py --verify "$BUILD_TREE" --host "$(hostname)" --sha "$CI_COMMIT_SHA"; then
        echo "B1026: $BUILD_TREE was built by this host at this sha -- using it as the build job left it"
      else
        echo "!!! B1026 STAMP MISMATCH: $BUILD_TREE on $(hostname) was not built here at $CI_COMMIT_SHA (stored vs expected above) -- the build job ran on another host or this tree is stale; REBUILDING IN-JOB (docs/ci.md, 'Two x86 runners: the host+sha stamp') !!!"
        willeq_build_tree
        python3 scripts/ci/prune_ref_build_trees.py --verify "$BUILD_TREE" --host "$(hostname)" --sha "$CI_COMMIT_SHA"
        echo "B1026: in-job rebuild done and verified on $(hostname)"
      fi

# B1038 (#358): the headless configuration (EQT_GRAPHICS=OFF, the `--no-graphics`
# client and its suite). Nothing built it before: the hygiene job configures
# OFF but compiles no C++, so 5 TUs rotted unseen until B1031's macOS probe
# found them (docs/ci.md, "The headless build"). Same stage as `build-test`, so on
# two runners the two build in parallel. It runs the SHARED willeq_build_tree
# (WILLEQ_HEADLESS=1 picks the OFF configure and skips the Irrlicht bootstrap)
# into its own tree, and runs ctest IN THIS JOB right after the host+sha
# claim -- build and suite can never land on different hosts, so it needs no
# B1026 verify. WILLEQ_REQUIRE_ASSETS as in `build-test`: an absent asset root is a
# FAIL here, never a silent SKIP.
build-headless:
  extends: .goldfarm
  stage: build
  # B1042: docs-only diffs skip it, like build-test.
  rules: !reference [.code_rules, rules]
  variables:
    # Its own per-ref tree (B1012 layout under build-headless/), so the
    # B1026 stamp is per tree and the graphics tree is never reconfigured OFF.
    BUILD_TREE: build-headless/ref/$CI_COMMIT_REF_SLUG
    WILLEQ_HEADLESS: "1"
    WILLEQ_REQUIRE_ASSETS: "1"
  script:
    - !reference [.build_tree, script]
    - willeq_build_tree
    - nice -n 10 ctest --test-dir "$BUILD_TREE" -LE hygiene -j $CTEST_JOBS --output-on-failure 2>&1 | tee ctest-headless.log
    - cp "$BUILD_TREE/Testing/Temporary/LastTest.log" ctest-headless-LastTest.log || true
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - ctest-headless.log
      - ctest-headless-LastTest.log

# Stage 2: build AND the full suite in ONE job (B1042, #362). Until B1042
# `build` and `test` were two stages; on two runners they landed on different
# hosts in 25 of the last 50 pipelines that ran both (pipelines 820..909,
# jobs API runner.id; review/B1042/README.md), and each split cost the
# `test` job a second build on its own host (B1026's in-job rebuild) plus a
# second queue wait behind every other pipeline. One job builds and tests on
# one host, so the B1026 verify below is a file read that MATCHES; it stays
# as the net in case the claim step ever moves. The suite runs minus the two
# documented special cases:
#   - visual_gate      -- runs in the `gate` stage (it needs build-gles2/).
#   - RDPServerFrameTest.UpdateFrameMultipleTimes -- documented intermittent
#     race; re-run on its own with --repeat until-pass:3.
build-test:
  extends: .goldfarm
  stage: build
  rules: !reference [.code_rules, rules]
  variables:
    # B815: an absent asset root is a SKIP in a local run, but CI has the
    # assets (before_script re-makes the gitignored symlinks) and must never
    # skip them silently -- under this value the same condition is a hard
    # FAIL. tests/asset_requirement.h implements the check;
    # test_asset_requirement pins both outcomes.
    WILLEQ_REQUIRE_ASSETS: "1"
  script:
    - !reference [.build_tree, script]
    - willeq_build_tree
    # B1026: never test a tree another host or another commit built.
    - !reference [.verify_build_tree, script]
    - nice -n 10 ctest --test-dir "$BUILD_TREE" -j $CTEST_JOBS --output-on-failure -E '(^visual_gate$|^RDPServerFrameTest\.UpdateFrameMultipleTimes$)' 2>&1 | tee ctest.log
    - nice -n 10 ctest --test-dir "$BUILD_TREE" -R '^RDPServerFrameTest\.UpdateFrameMultipleTimes$' --repeat until-pass:3 --output-on-failure 2>&1 | tee -a ctest.log
    - cp "$BUILD_TREE/Testing/Temporary/LastTest.log" ctest-LastTest.log || true
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - ctest.log
      - ctest-LastTest.log

# B1208 (#527): the worker build job. `scripts/hermes/rbuild --via ci <wt> ...`
# commits the worktree as a WIP commit on its task branch and pushes it with
# `-o ci.variable=RBUILD_TARGET=<t>` (+ RBUILD_TEST=<regex> for `test -R`), so
# a kanban worker's build lands on an x86-build runner (gitlab-runner-1/2 or
# the ThinkPad) over GitLab's own job queue -- the runner VMs answer no inbound
# ssh (refactor/B1194/README.md). The pipeline holds this job alone
# (`.not_rbuild` + the workflow rule). The build steps are the shared
# willeq_build_tree in this ref's warm tree, the build-test configure exactly:
#   RBUILD_TARGET=<t...>  cmake --build --target <t...>; then, when RBUILD_TEST
#                         is set, ctest -R "$RBUILD_TEST" on that tree;
#   RBUILD_TARGET=auto    the targets that declare a test matching RBUILD_TEST
#                         (scripts/ci/rbuild_test_targets.py), then that ctest;
#   RBUILD_TARGET=hygiene the hygiene job's configure + ctest -L hygiene.
# rbuild streams this job's trace and downloads the artifacts into
# <worktree>/.rbuild-ci/<pipeline id>/ (docs/ci.md, "The rbuild job").
rbuild:
  extends: .goldfarm
  stage: build
  rules:
    - if: $RBUILD_TARGET && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "fable"
  variables:
    # As in build-test: CI has the assets, so their absence is a FAIL (B815).
    WILLEQ_REQUIRE_ASSETS: "1"
  script:
    - !reference [.build_tree, script]
    - |
      echo "rbuild: RBUILD_TARGET='$RBUILD_TARGET' RBUILD_TEST='${RBUILD_TEST:-}' on $(hostname) at $CI_COMMIT_SHA"
      if [ "$RBUILD_TARGET" = hygiene ]; then
        nice -n 10 cmake -S . -B build/hygiene -DCMAKE_BUILD_TYPE=$CMAKE_BUILD_TYPE -DEQT_GRAPHICS=OFF -DEQT_BUILD_TESTS=ON $CCACHE_CMAKE_ARGS
        nice -n 10 ctest --test-dir build/hygiene -L hygiene -j $CTEST_JOBS --output-on-failure --output-junit "$CI_PROJECT_DIR/rbuild-junit.xml" 2>&1 | tee rbuild-ctest.log
      else
        if [ "$RBUILD_TARGET" = auto ]; then
          [ -n "${RBUILD_TEST:-}" ] || { echo "rbuild: RBUILD_TARGET=auto needs RBUILD_TEST"; exit 2; }
          python3 scripts/ci/rbuild_test_targets.py --write-query "$BUILD_TREE"
        fi
        export WILLEQ_BUILD_TARGETS="$RBUILD_TARGET"
        willeq_build_tree
        if [ -n "${RBUILD_TEST:-}" ]; then
          nice -n 10 ctest --test-dir "$BUILD_TREE" -R "$RBUILD_TEST" --no-tests=error -j $CTEST_JOBS --output-on-failure --output-junit "$CI_PROJECT_DIR/rbuild-junit.xml" 2>&1 | tee rbuild-ctest.log
        fi
      fi
  after_script:
    # Only a job that ran ctest has a LastTest.log of its own (a warm tree may hold an older one).
    - 'if [ -f rbuild-ctest.log ]; then d="build/ref/$CI_COMMIT_REF_SLUG"; [ "$RBUILD_TARGET" = hygiene ] && d=build/hygiene; cp "$d/Testing/Temporary/LastTest.log" rbuild-LastTest.log || true; fi'
  artifacts:
    when: always
    expire_in: 2 days
    paths:
      - rbuild-ctest.log
      - rbuild-junit.xml
      - rbuild-LastTest.log
    reports:
      junit: rbuild-junit.xml

# T503 -- ARM cross-build for the Orange Pi, on the SECOND runner
# (dev-u24-arm-nfs: user-mode shell runner on the dev host, tag arm-nfs; it has
# docker, the willeq-arm-noble image and the NFS share the Pi also mounts).
# hermes-ext workers cannot see NFS but can ssh to the Pi, so the job publishes
# to /mnt/projects/fable/ci-arm/<sha>/ and a worker runs it there over ssh.
# Automatic on fable; on any other ref it is a MANUAL job that never blocks the
# pipeline (`glab ci trigger build-arm`). Own final stage + `needs: []`: it starts
# immediately and the x86 gate never waits for an ARM build.
build-arm:
  stage: arm
  tags: [arm-nfs]
  needs: []
  dependencies: []
  timeout: 2h
  interruptible: true
  variables:
    # Both ARM jobs share this concurrent=1 runner's ONE checkout, so each must
    # keep BOTH build trees: excluding only its own dir made build-arm wipe
    # build-arm64-noble/ and build-arm64 wipe build-arm-noble/ (which holds the
    # incremental cache/), i.e. two cold cross-builds per fable pipeline.
    # Keep this line identical in build-arm and build-arm64 (B1030 review).
    GIT_CLEAN_FLAGS: -ffdx -e build-arm-noble -e build-arm64-noble
    # B1087: the runner has one checkout per slot, so the in-tree cache above is cold in a
    # slot that never built ARM; this host ccache (scripts/ci/arm_ccache.sh) is shared by all
    # slots. Absent on a host = ccache off, never a failure.
    ARM_CCACHE_DIR: /var/cache/ccache-ci-arm
    # B1095: same cap as build-arm64 below. Without it the armhf container ran cmake at
    # -j$(nproc) = 16 on the 16 GB runner VMs (MemAvailable 0.26 GB, 1-2 GB swap, load 16.8,
    # Prometheus 2026-10-18) while every x86 job left >= 7.5 GB free.
    BUILD_JOBS: "8"
  rules:
    - !reference [.not_rbuild, rules]
    - if: $CI_COMMIT_BRANCH == "fable"
    - when: manual
      allow_failure: true
  script:
    - set -o pipefail
    # B1087 (#407): the ThinkPad is the primary runner; dev-u24's runner is paused but kept.
    # 2026-10-18 (Will): gitlab-runner-1/2 carry every tag again (docker + NAS NFS + ARM ccache provisioned); 2026-10-19 (Will): concurrent=2 + CI_JOBS=6 on the VMs, B1095-capped ARM builds included.
    - 'case "$(hostname)" in dev-u24|thinkpad|gitlab-runner-1|gitlab-runner-2) ;; *) echo "refusing to build on $(hostname)"; exit 1 ;; esac'
    # B970: verify/fill the vendored Irrlicht+libpng store first; fails naming the pin.
    # B1093 (#413): kill any ARM build container an earlier cancelled/timed-out job left on this host.
    - bash scripts/ci/arm_container.sh --sweep
    - scripts/ci/vendor_fetch.sh --ensure
    # B1095: the runner's CI_JOBS wins (B1087's rule for the x86 jobs), as in build-arm64.
    - 'if [ -n "${CI_JOBS:-}" ]; then export BUILD_JOBS="$CI_JOBS"; fi; echo "BUILD_JOBS=$BUILD_JOBS"'
    # Full log kept as an artifact; on failure print the compiler errors, not a
    # blind tail (B1054's ARM-only compile error never reached the trace).
    - nice -n 10 scripts/build-arm-noble.sh > build-arm-noble.log 2>&1 || { grep -nE 'error:|undefined reference|ERROR:' build-arm-noble.log | head -n 40; tail -n 40 build-arm-noble.log; exit 1; }
    - tail -n 20 build-arm-noble.log
    - scripts/pi/publish_arm_build.sh "$CI_COMMIT_SHA" "${CI_COMMIT_BRANCH:-$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}"
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - build-arm-noble.log

# B1030 (#350): the aarch64 lanes' binary (Rock64 + ROCK 4D), the same runner
# and the same shape as build-arm, published to ci-arm64/<sha>/. The runner is
# concurrent=1, so the two ARM builds of a fable pipeline run one after the
# other (one C++ build at a time on dev-u24); BUILD_JOBS caps the docker build
# so a hand-run build on the host still fits beside it. Manual off fable
# (`glab ci trigger build-arm64`), exactly like build-arm.
build-arm64:
  stage: arm
  tags: [arm-nfs]
  needs: []
  dependencies: []
  timeout: 2h
  interruptible: true
  variables:
    # Same line as build-arm: the two jobs share one checkout (see there).
    GIT_CLEAN_FLAGS: -ffdx -e build-arm-noble -e build-arm64-noble
    BUILD_JOBS: "8"
    ARM_CCACHE_DIR: /var/cache/ccache-ci-arm
  rules:
    - !reference [.not_rbuild, rules]
    - if: $CI_COMMIT_BRANCH == "fable"
    - when: manual
      allow_failure: true
  script:
    - set -o pipefail
    # B1087 (#407): the ThinkPad is the primary runner; dev-u24's runner is paused but kept.
    # 2026-10-18 (Will): gitlab-runner-1/2 carry every tag again (docker + NAS NFS + ARM ccache provisioned); 2026-10-19 (Will): concurrent=2 + CI_JOBS=6 on the VMs, B1095-capped ARM builds included.
    - 'case "$(hostname)" in dev-u24|thinkpad|gitlab-runner-1|gitlab-runner-2) ;; *) echo "refusing to build on $(hostname)"; exit 1 ;; esac'
    # B1093 (#413): kill any ARM build container an earlier cancelled/timed-out job left on this host.
    - bash scripts/ci/arm_container.sh --sweep
    - scripts/ci/vendor_fetch.sh --ensure
    - 'if [ -n "${CI_JOBS:-}" ]; then export BUILD_JOBS="$CI_JOBS"; fi; echo "BUILD_JOBS=$BUILD_JOBS"'
    # Full log kept as an artifact; on failure print the compiler errors, not a
    # blind tail (B1054's ARM-only compile error never reached the trace).
    - nice -n 10 scripts/build-arm64-noble.sh > build-arm64-noble.log 2>&1 || { grep -nE 'error:|undefined reference|ERROR:' build-arm64-noble.log | head -n 40; tail -n 40 build-arm64-noble.log; exit 1; }
    - tail -n 20 build-arm64-noble.log
    - scripts/pi/publish_arm64_build.sh "$CI_COMMIT_SHA" "${CI_COMMIT_BRANCH:-$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}"
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - build-arm64-noble.log

# Stage 4: the visual gate (T80/T291) -- golden frames + CPU-p95 + memory ledger
# over build-gles2/bin/gles2_zone_benchmark against real client assets.
# allow_failure is FALSE: hermes-ext has both asset trees and the pristine
# Irrlicht source, so nothing here is legitimately skippable. The CPU-p95
# assertion is load-sensitive (see tests/cmake/eqe1.cmake), so the retry is
# inside the script: up to 3 attempts, and the gate must pass one of them.
#
# B813 revert (Will, 2026-09-28; docs/decisions.md): budgets ratchet down
# only. iceclad and timorous ran in a separate allow_failure job while they
# overran two ledger budgets; B903/B904 (2026-09-29) fixed both in code, so the
# ONE blocking job runs all five manifest zones again. --zones stays explicit:
# the list must equal the manifest's zones exactly (checked by the hygiene test
# VisualGateLedgerAssertions, scripts/ci/test_visual_gate_ledger.py). No waiver
# list, no per-zone budget.
.visual_gate_prepare:
  script:
    # visual_gate.py needs PIL; hermes-ext's python3.12 has no Pillow and no
    # ensurepip, so install it once into a cache dir with the pip from the
    # host's existing ~/.venvs/ci (python3.11) driving the 3.12 interpreter.
    - PYLIBS=$HOME/.cache/willeq-ci/pylibs
    - python3 -c "import PIL" 2>/dev/null || $HOME/.venvs/ci/bin/pip --python /usr/bin/python3 install -q --target "$PYLIBS" Pillow
    - export PYTHONPATH="$PYLIBS${PYTHONPATH:+:$PYTHONPATH}"
    - python3 -c "import PIL; print('PIL', PIL.__version__)"
    # build-gles2/ is preserved between pipelines. The bootstrap script always
    # wipes and rebuilds Irrlicht, so only call it when there is no benchmark
    # binary yet; otherwise build the two targets incrementally (cmake re-runs
    # its own configure if CMakeLists.txt changed).
    # B959: the gate's incremental path never looked at libIrrlicht, so a
    # driver-source change (a new eqt* symbol) linked against the OLD warm lib
    # whenever this job ran on a runner where the build job's rebuild was not
    # the one that landed. Same stamp check as the build job; a mismatch
    # rebuilds the lib (and rewrites the stamp) before the incremental build,
    # whose willeq / gles2_zone_benchmark then relink against it.
    - |
      if [ ! -f third_party/irrlicht-gles2-x86/lib/libIrrlicht.a ] || ! bash scripts/ci/irrlicht_input_stamp.sh verify third_party/irrlicht-gles2-x86/irrlicht_input_stamp.txt; then
        JOBS=$JOBS nice -n 10 bash scripts/build-gles2-x86.sh --irrlicht-only
      fi
    # B1012: the gate's tree is per ref too. GLES2_BUILD_DIR steers
    # build-gles2-x86.sh and WILLEQ_GLES2_BUILD_DIR steers visual_gate.py
    # (both default to build-gles2/ for a developer's checkout).
    - export GLES2_BUILD_DIR="$PWD/$GLES2_TREE" WILLEQ_GLES2_BUILD_DIR="$PWD/$GLES2_TREE"
    - python3 scripts/ci/prune_ref_build_trees.py --stamp "$GLES2_TREE" --ref "$CI_COMMIT_REF_NAME"
    # B1042: a warm tree is re-configured with $CCACHE_CMAKE_ARGS (a tree
    # configured before ccache existed has no launcher; seconds on a warm
    # cache); the cold bootstrap takes the launcher from the exported
    # CMAKE_*_COMPILER_LAUNCHER (build-gles2-x86.sh).
    - |
      if [ -x "$GLES2_TREE/bin/gles2_zone_benchmark" ]; then
        nice -n 10 cmake -S . -B "$GLES2_TREE" $CCACHE_CMAKE_ARGS 2>&1 | tail -n 5
        nice -n 10 cmake --build "$GLES2_TREE" --target willeq gles2_zone_benchmark -j "$JOBS" 2>&1 | tail -n 60
      else
        JOBS=$JOBS nice -n 10 bash scripts/build-gles2-x86.sh 2>&1 | tail -n 100
      fi
      ccache_report "$GLES2_TREE"

# B923 / #242: the CLIENT's own memory ledger against its budgets, run on a
# schedule rather than by hand. The blocking `gate` job below measures
# gles2_zone_benchmark, which never builds the client's collision and occluder
# structures, so the client-only ledger owners (spatial's sp.* rows, and audio,
# B977/#295) are asserted HERE: the rendered client (orangepi preset,
# WILLEQ_BASELINE=1, the same invocation ClientLedgerLive ctest uses) zoned
# into iceclad past steady_60s, with --assert-budgets -- every budgeted
# memoryLedgerBudgets category at ready and steady_60s must be inside its
# budget or the job is red (client_ledger_table.py check's exit 1).
#
# MANUAL, allow_failure: it takes the eqemu lane lock (one snapshot, one
# restore with the world down, the lane's own discipline) and holds the lane
# ~20 minutes, so it never blocks the pipeline; the schedule and an operator
# both trigger it (issue #242 acceptance 2: "ClientLedgerLive on a schedule
# with the result recorded"). The evidence dir and the check's per-category
# lines are artifacts -- the recorded result. Needs the willeq binary from
# the `build-test` job's tree ($BUILD_TREE/bin/willeq), not build-gles2/'s.
# B1042: same docs-only skip as `.code_rules` (it must be, `needs:
# [build-test]` names a job that a docs-only pipeline does not have).
#
# Declared ABOVE `gate:` on purpose: test_visual_gate_ledger asserts the gate
# job's body (the text after "\ngate:") contains no "allow_failure: true", so
# this manual job must not sit in that slice. Same stage (gate), so the file
# order is cosmetic to the pipeline.
client-ledger-live:
  extends: .goldfarm
  stage: gate
  needs: [build-test]
  dependencies: [build-test]
  rules:
    - !reference [.not_rbuild, rules]
    - if: $WILLEQ_FULL_PIPELINE == "1"
      when: manual
      allow_failure: true
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        regexp: *code_change_re
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == "fable"
      changes:
        regexp: *code_change_re
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH
      changes:
        regexp: *code_change_re
        compare_to: refs/heads/fable
      when: manual
      allow_failure: true
  script:
    # B1026: `needs: [build-test]` does not put this job on that job's host.
    - !reference [.verify_build_tree, script]
    - test -x "$BUILD_TREE/bin/willeq" || { echo "no $BUILD_TREE/bin/willeq -- the build-test job did not land"; exit 1; }
    - |
      nice -n 10 bash scripts/client_ledger_capture.sh \
        --zones iceclad --modes spatial --assert-budgets \
        --owner ci-client-ledger \
        --out client-ledger-live/client-ledger-$(date -u +%Y%m%dT%H%M%SZ) 2>&1 | tee client-ledger-live/log.txt
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - client-ledger-live/

# B1026: no host+sha verify here. The gate never reads $BUILD_TREE: its
# `.visual_gate_prepare` builds its own $GLES2_TREE IN THIS JOB (incremental
# `cmake --build` of willeq + gles2_zone_benchmark, or the full bootstrap), on
# whichever host the job landed, so the binary it measures is always this
# host's build of this commit.
gate:
  extends: .goldfarm
  stage: gate
  allow_failure: false
  rules: !reference [.code_rules, rules]
  script:
    - !reference [.visual_gate_prepare, script]
    - |
      set +e
      for attempt in 1 2 3; do
        echo "=== visual_gate attempt $attempt/3 ==="
        nice -n 10 bash scripts/ci/visual_gate.sh --zones qeynos2,gfaydark,befallen,iceclad,timorous 2>&1 | tee -a gate.log
        rc=${PIPESTATUS[0]}
        [ "$rc" -eq 0 ] && break
        echo "attempt $attempt failed (rc=$rc)" | tee -a gate.log
      done
      exit "$rc"
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - gate.log
      - build-gles2/ref/*/ci_artifacts/

# B929 (#247): the zone budget census -- every era zone against every budget.
# The blocking `gate` above asserts the five manifest zones; this job sweeps
# ALL of scripts/ci/zone_content_sweep_zones.tsv (the 118-zone T490 census,
# B852's list) and asserts, per zone: every estimate budget pair the gate
# checks (placeableObjectsBytes and the rest of MEMORY_BUDGET_PAIRS minus the
# two also-baselined) AND every memoryLedgerBudgets category, all against the
# budgets the benchmark read out of the shipped orangepi preset -- the same
# numbers the gate compares against, so config/constrained_presets.json stays
# the single source and a zone over ANY budget fails the pipeline (B929's
# growthplane sat at 28,687,788 B of placeableObjectsBytes against 25,165,824
# with nothing asserting it: refactor/B927/category_census.tsv, the issue's
# own evidence).
#
# The full census is too slow for the ctest suite: 118 sequential
# gles2_zone_benchmark zone loads measured 246 s of zone time + the
# script's own 2 s polling ticks = 4m46s on the runner-class host's
# llvmpipe (refactor/B929/README.md), so it runs HERE, in the gate stage.
# It is BLOCKING (allow_failure false, no retries): the gate's 3 in-script
# retries exist because its CPU-p95 assertion is load-sensitive; the census
# asserts memory figures that are load-invariant by construction
# (platform-independent vertex/index sums and allocator-ledger live bytes at
# a fixed lifecycle point -- B927/README.md), so a retry would only mask a
# real over-budget zone. The budgets are BLESS-ONLY (Will): the job reads
# them and fails against them; a red row is code to fix, never a number to
# move (the ratchet-down rule, docs/ci.md).
#
# Same shape as the `gate` job: .visual_gate_prepare builds the benchmark
# into $GLES2_TREE in this job (the per-ref warm tree), so the binary it
# sweeps is this host's build of this commit. The ctest legs of the same
# net: test_zone_budget_census (pure python, every pipeline) and
# zone_budget_census_smoke (the 3-zone smoke, label slow, in build-test).
zone-budget-census:
  extends: .goldfarm
  stage: gate
  allow_failure: false
  needs: []
  rules: !reference [.code_rules, rules]
  script:
    - !reference [.visual_gate_prepare, script]
    - |
      # B929: heal stale EQE1 packs (B930's soldunga signature) into a local
      # pack tree the sweep reads (--eqe1-path below). The NFS pack tree is
      # read-only for the runner, so clean packs are linked and stale ones
      # rebuilt into $GLES2_TREE (the per-ref build tree this job owns);
      # the tools build there on demand.
      nice -n 10 cmake --build "$GLES2_TREE" --target verify_eqe1 eqe1_builder -j "$JOBS" 2>&1 | tail -n 10
      nice -n 10 bash scripts/ci/zone_census_pack_selfheal.sh \
        --verify "$GLES2_TREE/bin/verify_eqe1" \
        --builder "$GLES2_TREE/bin/eqe1_builder" \
        --eq-path data/eq_client --pack-dir data/eqe1_client \
        --out-dir "$GLES2_TREE/b929_packs" 2>&1 | tee census-pack-heal.log
    - |
      set -o pipefail
      nice -n 10 bash scripts/ci/zone_content_sweep.sh \
        --out-dir "$GLES2_TREE/b929_census" \
        --bench-bin "$GLES2_TREE/bin/gles2_zone_benchmark" \
        --eqe1-path "$GLES2_TREE/b929_packs" 2>&1 | tee census-sweep.log
      nice -n 10 python3 scripts/ci/zone_budget_census.py --check-budgets \
        --sweep-dir "$GLES2_TREE/b929_census" \
        --out census-budget-rows.tsv 2>&1 | tee census-budget.log
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - census-sweep.log
      - census-pack-heal.log
      - census-budget.log
      - census-budget-rows.tsv
      - build-gles2/ref/*/b929_census/results.tsv

