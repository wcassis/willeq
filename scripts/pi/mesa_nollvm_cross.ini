# B932: meson cross file for the LLVM-less Mesa (armhf, Ubuntu Noble).
# No -march/-mfpu overrides: the compiler's Ubuntu armhf defaults are what
# Ubuntu's own mesa packages were built with, so the A/B isolates LLVM.
[binaries]
c = 'arm-linux-gnueabihf-gcc'
cpp = 'arm-linux-gnueabihf-g++'
ar = 'arm-linux-gnueabihf-ar'
strip = 'arm-linux-gnueabihf-strip'
pkg-config = 'pkg-config'

[properties]
pkg_config_libdir = ['/usr/lib/arm-linux-gnueabihf/pkgconfig', '/usr/share/pkgconfig']

[host_machine]
system = 'linux'
cpu_family = 'arm'
cpu = 'armv7'
endian = 'little'
